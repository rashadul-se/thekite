# For any Kubernetes cluster (Render itself runs Docker, not k8s; see render.yaml).
apiVersion: v1
kind: Secret
metadata: {name: eldercare-secret}
stringData:
  DATABASE_URL: postgresql://user:pass@postgres:5432/care
  REDIS_URL: redis://redis:6379/0
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: eldercare}
spec:
  replicas: 3
  selector: {matchLabels: {app: eldercare}}
  template:
    metadata: {labels: {app: eldercare}}
    spec:
      containers:
        - name: app
          image: YOUR_REGISTRY/eldercare:latest
          ports: [{containerPort: 8501}]
          envFrom: [{secretRef: {name: eldercare-secret}}]
          env: [{name: AUTO_SEED, value: "false"}]
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe: {httpGet: {path: /_stcore/health, port: 8501}, initialDelaySeconds: 10}
          livenessProbe: {httpGet: {path: /_stcore/health, port: 8501}, initialDelaySeconds: 20}
---
apiVersion: v1
kind: Service
metadata: {name: eldercare}
spec:
  selector: {app: eldercare}
  ports: [{port: 80, targetPort: 8501}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: eldercare}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: eldercare}
  minReplicas: 3
  maxReplicas: 10
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eldercare
  annotations:   # Streamlit uses websockets: keep a user on one pod
    nginx.ingress.kubernetes.io/affinity: cookie
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  rules:
    - host: care.example.com
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: eldercare, port: {number: 80}}}}]}
